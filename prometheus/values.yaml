# Overrides for the prometheus-community/prometheus chart.
# Everything not listed here uses the upstream chart defaults.
#
# Agents ship metrics via Grafana Alloy using Prometheus remote_write,
# so the server must expose a remote-write receiver behind an
# authenticated ingress. Pushgateway is no longer used.

server:
  extraFlags:
    - web.enable-lifecycle
    # Required so agents can push metrics via remote_write.
    - web.enable-remote-write-receiver

  retention: "15d"

  persistentVolume:
    enabled: true
    size: 8Gi

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      # Basic auth protecting the remote-write endpoint.
      # The 'basic-auth' secret is generated by create_auth.sh.
      # Agent credentials: ALLOY_REMOTE_WRITE_USER / ALLOY_REMOTE_WRITE_PASSWORD.
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: basic-auth
      nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - user'
    hosts:
      - prometheus.compassvpn.org
    path: /
    pathType: Prefix

# Not used by the CompassVPN dashboard.
alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

# Agents ship their own node-exporter metrics.
prometheus-node-exporter:
  enabled: false

# Deprecated: agents use remote_write, not pushgateway.
prometheus-pushgateway:
  enabled: false
