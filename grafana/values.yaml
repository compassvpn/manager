# Overrides for the grafana/grafana chart.
# Everything not listed here uses the upstream chart defaults.

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - grafana.compassvpn.org
  path: /
  pathType: Prefix

persistence:
  type: pvc
  enabled: true
  size: 10Gi
